name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same branch/PR instead of queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, types, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `.node-version` is the single source of truth for the Node major.
      # pnpm/setup reads the pnpm version from `packageManager` in package.json,
      # but it does not read `.node-version`, so pass it through explicitly.
      - name: Resolve Node version
        id: node
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      # Installs pnpm + Node, caches the pnpm store, and runs `pnpm install`
      # (pnpm forces --frozen-lockfile when CI is set). The `postinstall` hook
      # runs `wrangler types`, generating the git-ignored
      # `worker-configuration.d.ts` that `tsc` needs.
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ steps.node.outputs.version }}
          cache: true

      - name: Format
        run: pnpm format:check

      # Must run before typecheck/lint: `src/routeTree.gen.ts` is git-ignored and
      # generated by the TanStack Start Vite plugin, so a fresh clone has no route
      # tree until something builds. This also catches Vite/Wrangler build breaks
      # that `tsc` alone does not.
      - name: Build
        run: pnpm build

      # cf-typegen + tsc --noEmit + oxlint (including type-aware rules).
      - name: Types and lint
        run: pnpm check
